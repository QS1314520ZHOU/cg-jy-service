<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>呼吸机辅助呼吸视图 - 重症ICU系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100vh; overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            color: #333;
            font-size: 14px;
        }
        .container {
            height: 100vh;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 工具栏 ===== */
        .toolbar {
            background: #fff;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            flex-shrink: 0;
        }
        .toolbar select,
        .toolbar input[type="date"] {
            height: 34px;
            padding: 0 10px;
            border: 1px solid #c9d4f0;
            border-radius: 6px;
            background: #fff;
            color: #333;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        .toolbar select:focus,
        .toolbar input[type="date"]:focus {
            border-color: #3f7ef7;
            box-shadow: 0 0 0 3px rgba(63,126,247,.12);
        }
        .toolbar select { min-width: 130px; }
        .toolbar input[type="date"] { min-width: 150px; }

        /* 日期导航按钮样式 */
        .date-nav {
            display: inline-flex;
            align-items: center;
            gap: 0;
        }
        .date-nav-btn {
            width: 34px;
            height: 34px;
            border: 1px solid #c9d4f0;
            background: #fff;
            color: #3f7ef7;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all .15s;
        }
        .date-nav-btn:first-child {
            border-radius: 6px 0 0 6px;
            border-right: none;
        }
        .date-nav-btn:last-child {
            border-radius: 0 6px 6px 0;
            border-left: none;
        }
        .date-nav-btn:hover:not(:disabled) {
            background: #eef4ff;
            border-color: #3f7ef7;
        }
        .date-nav-btn:disabled {
            color: #c0c4cc;
            cursor: not-allowed;
            background: #f5f7fa;
        }
        .date-nav input[type="date"] {
            border-radius: 0;
            border-left: none;
            border-right: none;
            min-width: 140px;
        }
        .btn {
            height: 34px;
            padding: 0 18px;
            border-radius: 6px;
            border: 1px solid transparent;
            font-size: 14px;
            cursor: pointer;
            transition: all .15s;
            white-space: nowrap;
        }
        .btn-primary {
            background: #3f7ef7;
            color: #fff;
        }
        .btn-primary:hover { background: #2f6ce0; }
        .btn-primary:disabled { background: #9dbdfb; cursor: not-allowed; }
        .btn-export {
            background: #fff;
            border-color: #3f7ef7;
            color: #3f7ef7;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-export:hover { background: #eef4ff; }
        .toolbar .spacer { flex: 1; }

        /* ===== 表格区域 ===== */
        .table-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .table-wrapper {
            flex: 1;
            min-height: 0;
            overflow: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        thead th {
            background: #4f6dbe;
            color: #fff;
            font-weight: 500;
            text-align: center;
            padding: 12px 8px;
            border-right: 1px solid rgba(255,255,255,.35);
            border-bottom: 1px solid rgba(255,255,255,.35);
            position: sticky;
            top: 0;
            z-index: 2;
            white-space: nowrap;
        }
        thead th:last-child { border-right: none; }
        tbody td {
            text-align: center;
            border-bottom: 1px solid #e8edf5;
            border-right: 1px solid #eef2f8;
            color: #444;
        }
        tbody td:last-child { border-right: none; }
        tbody tr:nth-child(even) { background: #f7f9fd; }
        tbody tr:hover { background: #eef4ff; }
        /* 固定行高：单元格内容一律不换行、超出省略号，避免长诊断把行高撑开。
           完整内容通过 title 悬浮查看，导出 Excel 也是完整文本。 */
        tbody td {
            height: 40px;
            line-height: 40px;
            padding: 0 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* 诊断列左对齐，长文本阅读更自然 */
        .diag { text-align: left; }
        .empty-row td {
            color: #999;
            padding: 40px 0;
            font-size: 14px;
            height: auto;
            line-height: 1.6;
        }
        .error-row td { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 工具栏 -->
        <div class="toolbar">
            <select id="deptSelect" title="科室"></select>
            <div class="date-nav">
                <button class="date-nav-btn" id="prevDayBtn" onclick="changeDate(-1)" title="前一天">◀</button>
                <input type="date" id="queryDate" title="查询日期" onchange="validateDate()">
                <button class="date-nav-btn" id="nextDayBtn" onclick="changeDate(1)" title="后一天">▶</button>
            </div>
            <button class="btn btn-primary" id="queryBtn" onclick="doQuery()">查询</button>
            <div class="spacer"></div>
            <button class="btn btn-export" onclick="doExport()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                导出Excel
            </button>
        </div>

        <!-- 结果表格 -->
        <div class="table-card">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width:60px;">序号</th>
                            <th style="width:80px;">床号</th>
                            <th style="width:100px;">姓名</th>
                            <th style="width:60px;">性别</th>
                            <th style="width:60px;">年龄</th>
                            <th style="width:120px;">住院号</th>
                            <th style="width:170px;">入科时间</th>
                            <th style="width:170px;">出科时间</th>
                            <!-- 诊断列自适应剩余宽度；设最小宽度，窄屏时整表横向滚动而不被压扁 -->
                            <th style="min-width:240px;">诊断</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr class="empty-row"><td colspan="9">暂无数据</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        var currentRows = [];

        // ===== 初始化 =====
        document.addEventListener('DOMContentLoaded', function () {
            // 日期默认当天；支持 URL 参数 ?date=（便于分享/书签）
            var qs = new URLSearchParams(location.search);
            var initDate = qs.get('date') || fmtToday();
            document.getElementById('queryDate').value = initDate;

            // 设置日期最大值为今天（禁止选择未来日期）
            document.getElementById('queryDate').max = fmtToday();

            // 更新导航按钮状态
            updateNavButtons();

            loadDepartments(function () {
                doQuery();
            });
        });

        function fmtToday() {
            var d = new Date();
            var m = String(d.getMonth() + 1).padStart(2, '0');
            var day = String(d.getDate()).padStart(2, '0');
            return d.getFullYear() + '-' + m + '-' + day;
        }

        // ===== 日期导航功能 =====

        /**
         * 切换日期（+1天或-1天）
         * @param offset 偏移量：-1表示前一天，+1表示后一天
         */
        function changeDate(offset) {
            var dateInput = document.getElementById('queryDate');
            var currentDate = new Date(dateInput.value + 'T00:00:00');
            var today = new Date(fmtToday() + 'T00:00:00');

            // 计算新日期
            var newDate = new Date(currentDate);
            newDate.setDate(newDate.getDate() + offset);

            // 检查是否超过今天
            if (newDate > today) {
                return; // 不允许超过今天
            }

            // 检查是否为有效日期
            if (isNaN(newDate.getTime())) {
                return;
            }

            // 格式化为 YYYY-MM-DD
            var m = String(newDate.getMonth() + 1).padStart(2, '0');
            var day = String(newDate.getDate()).padStart(2, '0');
            var dateStr = newDate.getFullYear() + '-' + m + '-' + day;

            // 更新输入框
            dateInput.value = dateStr;

            // 更新按钮状态
            updateNavButtons();

            // 自动查询
            doQuery();
        }

        /**
         * 验证日期输入（手动输入时调用）
         * 确保不超过今天
         */
        function validateDate() {
            var dateInput = document.getElementById('queryDate');
            var inputDate = new Date(dateInput.value + 'T00:00:00');
            var today = new Date(fmtToday() + 'T00:00:00');

            // 如果输入的日期超过今天，重置为今天
            if (inputDate > today) {
                dateInput.value = fmtToday();
            }

            // 如果输入的日期无效，重置为今天
            if (isNaN(inputDate.getTime())) {
                dateInput.value = fmtToday();
            }

            // 更新按钮状态
            updateNavButtons();
        }

        /**
         * 更新导航按钮的禁用状态
         * 后一天按钮：如果当前日期是今天，则禁用
         */
        function updateNavButtons() {
            var dateInput = document.getElementById('queryDate');
            var nextBtn = document.getElementById('nextDayBtn');
            var currentDate = new Date(dateInput.value + 'T00:00:00');
            var today = new Date(fmtToday() + 'T00:00:00');

            // 如果当前日期是今天或今天之后，禁用后一天按钮
            // 使用日期比较（忽略时间）
            var currentDateOnly = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate());
            var todayOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate());

            nextBtn.disabled = currentDateOnly >= todayOnly;
        }

        // ===== 科室下拉（默认第一条，预留多条） =====
        function loadDepartments(callback) {
            fetch(baseUrl() + '/api/vent/departments')
                .then(function (r) { return r.json(); })
                .then(function (res) {
                    var list = res.data || [];
                    var sel = document.getElementById('deptSelect');
                    sel.innerHTML = list.map(function (d) {
                        return '<option value="' + esc(d.code) + '">' + esc(d.name || d.shortName || d.code) + '</option>';
                    }).join('');
                })
                .catch(function (e) {
                    console.error('加载科室失败:', e);
                })
                .finally(function () { if (callback) callback(); });
        }

        // ===== 查询 =====
        function doQuery() {
            var deptCode = document.getElementById('deptSelect').value;
            var date = document.getElementById('queryDate').value;

            if (!deptCode) { renderError('未获取到科室信息'); return; }
            if (!date) { alert('请选择查询日期'); return; }

            var btn = document.getElementById('queryBtn');
            btn.disabled = true;
            btn.textContent = '查询中...';

            var url = baseUrl() + '/api/vent/query?deptCode=' + encodeURIComponent(deptCode)
                + '&date=' + encodeURIComponent(date);

            fetch(url)
                .then(function (r) { return r.json(); })
                .then(function (res) {
                    if (res.code !== 200) throw new Error(res.message || '查询失败');
                    currentRows = res.data || [];
                    renderTable(currentRows);
                })
                .catch(function (e) {
                    console.error(e);
                    renderError(e.message || '网络请求失败');
                })
                .finally(function () {
                    btn.disabled = false;
                    btn.textContent = '查询';
                });
        }

        // ===== 渲染表格 =====
        function renderTable(rows) {
            var body = document.getElementById('tableBody');
            if (!rows.length) {
                body.innerHTML = '<tr class="empty-row"><td colspan="9">暂无数据</td></tr>';
                return;
            }
            body.innerHTML = rows.map(function (r) {
                var diagnosis = r.diagnosis || '--';
                return '<tr>'
                    + '<td>' + (r.seq || '') + '</td>'
                    + '<td>' + esc(r.bedNo || '--') + '</td>'
                    + '<td title="' + esc(r.name || '') + '">' + esc(r.name || '--') + '</td>'
                    + '<td>' + esc(r.gender || '--') + '</td>'
                    + '<td>' + (r.age != null ? r.age : '--') + '</td>'
                    + '<td title="' + esc(r.mrn || '') + '">' + esc(r.mrn || '--') + '</td>'
                    + '<td>' + esc(r.icuAdmissionTime || '--') + '</td>'
                    + '<td>' + esc(r.icuDischargeTime || '--') + '</td>'
                    + '<td class="diag" title="' + esc(diagnosis) + '">' + esc(diagnosis) + '</td>'
                    + '</tr>';
            }).join('');
        }

        function renderError(msg) {
            document.getElementById('tableBody').innerHTML =
                '<tr class="empty-row error-row"><td colspan="9">' + esc(msg) + '</td></tr>';
        }

        // ===== 导出 =====
        function doExport() {
            if (!currentRows.length) { alert('暂无数据可导出'); return; }
            var deptCode = document.getElementById('deptSelect').value;
            var date = document.getElementById('queryDate').value;
            var url = baseUrl() + '/api/vent/export?deptCode=' + encodeURIComponent(deptCode)
                + '&date=' + encodeURIComponent(date);
            window.location.href = url;
        }

        // ===== 工具函数 =====
        function baseUrl() { return window.location.origin; }

        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
